<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Dev-server shell only. Production HTML is generated per route by
      scripts/prerender.mjs, which builds its own <head> from route metadata.
      Nothing here reaches production.
    -->
    <script>
      (function (d) {
        d.classList.add('js');
        try {
          if (localStorage.getItem('theme') === 'dark') d.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })(document.documentElement);
    </script>
    <title>DevSaheb</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
