<!doctype html>
<meta charset="utf-8">
<!--
  Default Open Graph card, 1200x630.
  Rendered to og-default.png by build-icons.ps1.
  Phase 5 generates per-page cards from this same composition.
-->
<style>
  /* Self-hosted Geist, read straight from node_modules so the card uses the
     same face as the site. Headless Chrome loads it with
     --allow-file-access-from-files; see build-icons.ps1. */
  @font-face {
    font-family: 'Geist Variable';
    font-weight: 100 900;
    font-display: block;
    src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2-variations');
  }
  @font-face {
    font-family: 'JetBrains Mono Variable';
    font-weight: 100 800;
    font-display: block;
    src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2-variations');
  }

  html, body { margin:0; padding:0; width:1200px; height:630px; overflow:hidden; }
  body {
    background:#0B1020;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:72px 80px; box-sizing:border-box;
    font-family:'Geist Variable',"Segoe UI",system-ui,sans-serif; color:#F7F0E6;
  }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .top img { height:96px; }
  .kicker {
    font-family:'JetBrains Mono Variable',ui-monospace,Consolas,monospace; font-size:17px;
    letter-spacing:.22em; text-transform:uppercase; color:#CCAA50;
  }
  h1 {
    margin:0; font-size:74px; line-height:1.04; font-weight:800;
    letter-spacing:-.035em; max-width:15ch;
  }
  h1 em { font-style:normal; color:#CCAA50; }
  .rule { height:1px; background:rgba(204,170,80,.28); margin:38px 0 26px; }
  .foot {
    display:flex; justify-content:space-between; align-items:center;
    font-family:'JetBrains Mono Variable',ui-monospace,Consolas,monospace; font-size:18px;
    letter-spacing:.1em; text-transform:uppercase; color:#929CA8;
  }
  .foot b { color:#CCAA50; font-weight:400; }
</style>

<div class="top">
  <img src="ds-lockup-h-dark.svg" alt="">
  <span class="kicker">&lt;software engineering&gt;</span>
</div>

<div>
  <h1>Built to a standard,<br>not to a <em>deadline</em>.</h1>
  <div class="rule"></div>
  <div class="foot">
    <span>devsaheb.com</span>
    <span><b>Custom software</b> · Cloud · Mobile · AI</span>
  </div>
</div>
